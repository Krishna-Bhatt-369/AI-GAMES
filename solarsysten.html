<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D CSS & JS Solar System Planetarium</title>
    <style>
        /* ==========================================
           1. CSS VARIABLES & BASE STYLES
           ========================================== */
        :root {
            --bg-color: #030508;
            --orbit-color: rgba(255, 255, 255, 0.08);
            --orbit-active-color: rgba(0, 217, 255, 0.4);
            --text-color: #e0e6ed;
            --accent-color: #00d9ff;
            --speed-scale: 1;
            
            /* Planet Colors & Gradients */
            --sun-glow: radial-gradient(circle, #ffea79 0%, #ff9800 50%, rgba(255, 87, 34, 0.8) 70%, transparent 100%);
            --mercury-grad: radial-gradient(circle at 30% 30%, #a8a8a8, #575757, #1f1f1f);
            --venus-grad: radial-gradient(circle at 30% 30%, #ffd89b, #d48c46, #5c350d);
            --earth-grad: radial-gradient(circle at 30% 30%, #4facfe, #00f2fe 40%, #0052d4 70%, #00112c);
            --mars-grad: radial-gradient(circle at 30% 30%, #ff7e5f, #feb47b 40%, #a83211 70%, #3b0900);
            --jupiter-grad: repeating-linear-gradient(170deg, #d4a373, #d4a373 8px, #a37952 8px, #a37952 16px, #e9c46a 16px, #e9c46a 24px);
            --saturn-grad: radial-gradient(circle at 30% 30%, #e2d1a6, #d4b483, #6b583a);
            --uranus-grad: radial-gradient(circle at 30% 30%, #7efdcf, #53c7f0, #194a6b);
            --neptune-grad: radial-gradient(circle at 30% 30%, #4b6cb7, #182848, #0a101d);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-color);
        }

        /* Starry Backdrop */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(1.5px 1.5px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 40px 70px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, rgba(255,255,255,0.9), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 160px 120px, #ffffff, rgba(0,0,0,0));
            background-size: 200px 200px;
            opacity: 0.6;
            z-index: 0;
        }

        /* ==========================================
           2. 3D SCENE & ENGINE STYLES
           ========================================== */
        .viewport {
            width: 100vw;
            height: 100vh;
            perspective: 1000px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
        }

        .viewport:active {
            cursor: grabbing;
        }

        .scene {
            position: relative;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        .solar-plane {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
            transform: rotateX(65deg);
        }

        /* ==========================================
           3. CELESTIAL BODIES & ORBITS
           ========================================== */
        .sun {
            position: absolute;
            top: -40px;
            left: -40px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--sun-glow);
            box-shadow: 0 0 50px #ff9800, 0 0 100px rgba(255, 152, 0, 0.4);
            transform-style: preserve-3d;
            z-index: 10;
        }

        .orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            border: 1px solid var(--orbit-color);
            border-radius: 50%;
            transform-style: preserve-3d;
            transform: translate(-50%, -50%);
            transition: border-color 0.3s;
        }

        .orbit:hover {
            border-color: var(--orbit-active-color);
        }

        .planet-container {
            position: absolute;
            top: 0;
            left: 50%;
            transform-style: preserve-3d;
            transform: translate(-50%, -50%);
        }

        .planet {
            position: relative;
            border-radius: 50%;
            transform-style: preserve-3d;
            cursor: pointer;
            transition: transform 0.3s;
            box-shadow: inset -4px -4px 8px rgba(0, 0, 0, 0.7);
        }

        .planet:hover {
            transform: scale(1.3);
        }

        /* Atmosphere Glow */
        .planet::after {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
            pointer-events: none;
        }

        /* Billboarding: Keeps planets facing the camera */
        .billboard {
            transform-style: preserve-3d;
        }

        /* Planet Dimensions & Speeds */
        .orbit.mercury { width: 140px; height: 140px; }
        .planet.mercury { width: 10px; height: 10px; background: var(--mercury-grad); }

        .orbit.venus { width: 200px; height: 200px; }
        .planet.venus { width: 16px; height: 16px; background: var(--venus-grad); }

        .orbit.earth { width: 280px; height: 280px; }
        .planet.earth { width: 18px; height: 18px; background: var(--earth-grad); }

        .orbit.mars { width: 360px; height: 360px; }
        .planet.mars { width: 14px; height: 14px; background: var(--mars-grad); }

        .orbit.jupiter { width: 480px; height: 480px; }
        .planet.jupiter { width: 38px; height: 38px; background: var(--jupiter-grad); }

        .orbit.saturn { width: 620px; height: 620px; }
        .planet.saturn { width: 32px; height: 32px; background: var(--saturn-grad); }
        
        /* Saturn Rings */
        .saturn-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60px;
            height: 60px;
            border: 8px solid rgba(212, 180, 131, 0.5);
            border-left-color: rgba(212, 180, 131, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%) rotateX(75deg);
            pointer-events: none;
        }

        .orbit.uranus { width: 740px; height: 740px; }
        .planet.uranus { width: 24px; height: 24px; background: var(--uranus-grad); }
        
        /* Uranus Ring */
        .uranus-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 36px;
            height: 36px;
            border: 2px solid rgba(126, 253, 207, 0.4);
            border-radius: 50%;
            transform: translate(-50%, -50%) rotateY(70deg);
            pointer-events: none;
        }

        .orbit.neptune { width: 860px; height: 860px; }
        .planet.neptune { width: 22px; height: 22px; background: var(--neptune-grad); }

        /* ==========================================
           4. UI OVERLAYS & HUD CONTROLS
           ========================================== */
        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .header {
            background: rgba(3, 5, 8, 0.6);
            backdrop-filter: blur(8px);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            align-self: flex-start;
            pointer-events: auto;
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--accent-color);
        }

        /* Time Control Bar */
        .controls-bar {
            align-self: center;
            background: rgba(3, 5, 8, 0.75);
            backdrop-filter: blur(10px);
            padding: 12px 25px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            gap: 15px;
            pointer-events: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-color);
            padding: 6px 14px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
        }

        input[type=range] {
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        /* HUD Info Card */
        .hud-card {
            position: absolute;
            right: 20px;
            top: 20px;
            width: 300px;
            background: rgba(3, 5, 8, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 16px;
            padding: 20px;
            pointer-events: auto;
            transform: translateX(340px);
            transition: transform 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.15);
        }

        .hud-card.active {
            transform: translateX(0);
        }

        .hud-title {
            font-size: 1.5rem;
            color: var(--accent-color);
            margin-bottom: 4px;
        }

        .hud-type {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8a99ad;
            margin-bottom: 15px;
        }

        .hud-stat {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 4px;
        }

        .hud-stat-label {
            color: #8a99ad;
        }

        .hud-fact {
            margin-top: 15px;
            font-size: 0.85rem;
            line-height: 1.4;
            color: #c4d1e0;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px;
            border-radius: 8px;
            border-left: 2px solid var(--accent-color);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #8a99ad;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="ui-container">
        <div class="header">
            <h1>3D Solar System</h1>
        </div>

        <div class="controls-bar">
            <button class="btn" id="btn-reverse">Reverse</button>
            <button class="btn" id="btn-toggle">Pause</button>
            <button class="btn" id="btn-realtime">Real-Speed</button>
            <div class="slider-container">
                <label for="speed-slider">Speed:</label>
                <input type="range" id="speed-slider" min="0" max="5" step="0.1" value="1">
            </div>
            <button class="btn" id="btn-reset">Reset View</button>
        </div>

        <div class="hud-card" id="hud">
            <button class="close-btn" id="hud-close">&times;</button>
            <h2 class="hud-title" id="hud-name">Earth</h2>
            <div class="hud-type" id="hud-type">Terrestrial Planet</div>
            <div class="hud-stat"><span class="hud-stat-label">Distance from Sun</span><span id="hud-dist">149.6M km</span></div>
            <div class="hud-stat"><span class="hud-stat-label">Orbital Period</span><span id="hud-period">365.25 Days</span></div>
            <div class="hud-stat"><span class="hud-stat-label">Rotation Speed</span><span id="hud-rot">1,674 km/h</span></div>
            <div class="hud-stat"><span class="hud-stat-label">Known Moons</span><span id="hud-moons">1</span></div>
            <div class="hud-fact" id="hud-fact">Earth is the only astronomical object known to harbor life.</div>
        </div>
    </div>

    <div class="viewport" id="viewport">
        <div class="scene" id="scene">
            <div class="solar-plane" id="solar-plane">
                <div class="sun"></div>

                <div class="orbit mercury" data-planet="mercury">
                    <div class="planet-container">
                        <div class="billboard">
                            <div class="planet mercury"></div>
                        </div>
                    </div>
                </div>

                <div class="orbit venus" data-planet="venus">
                    <div class="planet-container">
                        <div class="billboard">
                            <div class="planet venus"></div>
                        </div>
                    </div>
                </div>

                <div class="orbit earth" data-planet="earth">
                    <div class="planet-container">
                        <div class="billboard">
                            <div class="planet earth"></div>
                        </div>
                    </div>
                </div>

                <div class="orbit mars" data-planet="mars">
                    <div class="planet-container">
                        <div class="billboard">
                            <div class="planet mars"></div>
                        </div>
                    </div>
                </div>

                <div class="orbit jupiter" data-planet="jupiter">
                    <div class="planet-container">
                        <div class="billboard">
                            <div class="planet jupiter"></div>
                        </div>
                    </div>
                </div>

                <div class="orbit saturn" data-planet="saturn">
                    <div class="planet-container">
                        <div class="billboard">
                            <div class="planet saturn">
                                <div class="saturn-ring"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="orbit uranus" data-planet="uranus">
                    <div class="planet-container">
                        <div class="billboard">
                            <div class="planet uranus">
                                <div class="uranus-ring"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="orbit neptune" data-planet="neptune">
                    <div class="planet-container">
                        <div class="billboard">
                            <div class="planet neptune"></div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        /* ==========================================
           5. ASTRONOMICAL DATA & CONFIGURATION
           ========================================== */
        const celestialData = {
            mercury: { name: "Mercury", type: "Terrestrial Planet", dist: "57.9M km", period: "88 Days", rot: "10.83 km/h", moons: 0, fact: "Mercury is the smallest planet in the Solar System and the closest to the Sun.", speed: 0.04 },
            venus: { name: "Venus", type: "Terrestrial Planet", dist: "108.2M km", period: "225 Days", rot: "6.52 km/h", moons: 0, fact: "Venus spins in the opposite direction to most planets and has a thick, toxic atmosphere.", speed: 0.015 },
            earth: { name: "Earth", type: "Terrestrial Planet", dist: "149.6M km", period: "365.25 Days", rot: "1,674 km/h", moons: 1, fact: "Earth is the only world in our solar system equipped with liquid water oceans on its surface.", speed: 0.01 },
            mars: { name: "Mars", type: "Terrestrial Planet", dist: "227.9M km", period: "687 Days", rot: "868 km/h", moons: 2, fact: "Mars is home to Olympus Mons, the largest volcano discovered in the solar system.", speed: 0.008 },
            jupiter: { name: "Jupiter", type: "Gas Giant", dist: "778.6M km", period: "11.86 Years", rot: "45,300 km/h", moons: 95, fact: "Jupiter's iconic Great Red Spot is a giant storm larger than Earth that has raged for centuries.", speed: 0.004 },
            saturn: { name: "Saturn", type: "Gas Giant", dist: "1.43B km", period: "29.45 Years", rot: "35,500 km/h", moons: 146, fact: "Saturn possesses the most extensive and complex ring system of any planet in our solar system.", speed: 0.003 },
            uranus: { name: "Uranus", type: "Ice Giant", dist: "2.87B km", period: "84 Years", rot: "9,320 km/h", moons: 28, fact: "Uranus rotates on its side at an angle of nearly 98 degrees, leading to extreme seasonal shifts.", speed: 0.002 },
            neptune: { name: "Neptune", type: "Ice Giant", dist: "4.50B km", period: "164.8 Years", rot: "9,660 km/h", moons: 16, fact: "Neptune is dark, cold, and whipped by supersonic winds—the fastest recorded in the solar system.", speed: 0.001 }
        };

        /* State Variables */
        let sceneState = {
            rotX: 65,
            rotY: 0,
            zoom: 1000,
            isDragging: false,
            lastMouseX: 0,
            lastMouseY: 0,
            targetRotX: 65,
            targetRotY: 0,
            targetZoom: 1000
        };

        let timeState = {
            scale: 1,
            isPaused: false,
            direction: 1
        };

        const orbits = [];

        /* DOM References */
        const viewport = document.getElementById('viewport');
        const scene = document.getElementById('scene');
        const solarPlane = document.getElementById('solar-plane');
        const billboards = document.querySelectorAll('.billboard');
        const hud = document.getElementById('hud');

        /* ==========================================
           6. ORBIT & ANIMATION ENGINE (JS)
           ========================================== */
        function initOrbits() {
            document.querySelectorAll('.orbit').forEach(orbitEl => {
                const key = orbitEl.getAttribute('data-planet');
                if (!key) return;
                
                orbits.push({
                    element: orbitEl,
                    key: key,
                    angle: Math.random() * 360,
                    speed: celestialData[key].speed
                });

                // Planet click listener
                orbitEl.querySelector('.planet').addEventListener('click', (e) => {
                    e.stopPropagation();
                    inspectPlanet(key);
                });
            });
        }

        function animate() {
            // Update orbital angles
            if (!timeState.isPaused) {
                orbits.forEach(orbit => {
                    orbit.angle += orbit.speed * timeState.scale * timeState.direction * 5;
                    orbit.element.style.transform = `translate(-50%, -50%) rotateZ(${orbit.angle}deg)`;
                });
            }

            // Smooth Interpolation for Camera
            sceneState.rotX += (sceneState.targetRotX - sceneState.rotX) * 0.1;
            sceneState.rotY += (sceneState.targetRotY - sceneState.rotY) * 0.1;
            sceneState.zoom += (sceneState.targetZoom - sceneState.zoom) * 0.1;

            // Apply Camera Transforms
            viewport.style.perspective = `${sceneState.zoom}px`;
            solarPlane.style.transform = `rotateX(${sceneState.rotX}deg) rotateZ(${sceneState.rotY}deg)`;

            // Counter-rotate billboards to face camera dynamically
            billboards.forEach(b => {
                b.style.transform = `rotateZ(${-sceneState.rotY}deg) rotateX(${-sceneState.rotX}deg)`;
            });

            requestAnimationFrame(animate);
        }

        /* ==========================================
           7. INTERACTIVE CAMERA & UI CONTROLS
           ========================================== */
        // Mouse Controls (Rotate Plane)
        window.addEventListener('mousedown', (e) => {
            if (e.target.closest('.ui-container')) return;
            sceneState.isDragging = true;
            sceneState.lastMouseX = e.clientX;
            sceneState.lastMouseY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!sceneState.isDragging) return;
            const deltaX = e.clientX - sceneState.lastMouseX;
            const deltaY = e.clientY - sceneState.lastMouseY;

            sceneState.targetRotY += deltaX * 0.4;
            sceneState.targetRotX = Math.max(10, Math.min(85, sceneState.targetRotX - deltaY * 0.4));

            sceneState.lastMouseX = e.clientX;
            sceneState.lastMouseY = e.clientY;
        });

        window.addEventListener('mouseup', () => sceneState.isDragging = false);

        // Mouse Wheel Zoom
        window.addEventListener('wheel', (e) => {
            sceneState.targetZoom = Math.max(400, Math.min(2500, sceneState.targetZoom + e.deltaY * 0.8));
        });

        // Time Bar Controls
        document.getElementById('speed-slider').addEventListener('input', (e) => {
            timeState.scale = parseFloat(e.target.value);
        });

        const btnToggle = document.getElementById('btn-toggle');
        btnToggle.addEventListener('click', () => {
            timeState.isPaused = !timeState.isPaused;
            btnToggle.textContent = timeState.isPaused ? "Play" : "Pause";
        });

        document.getElementById('btn-reverse').addEventListener('click', () => {
            timeState.direction *= -1;
        });

        document.getElementById('btn-realtime').addEventListener('click', () => {
            timeState.scale = 1;
            timeState.direction = 1;
            timeState.isPaused = false;
            document.getElementById('speed-slider').value = 1;
            btnToggle.textContent = "Pause";
        });

        document.getElementById('btn-reset').addEventListener('click', resetCamera);
        document.getElementById('hud-close').addEventListener('click', () => {
            hud.classList.remove('active');
        });

        /* Focus Planet Inspection */
        function inspectPlanet(key) {
            const data = celestialData[key];
            if (!data) return;

            // Render HUD Data
            document.getElementById('hud-name').textContent = data.name;
            document.getElementById('hud-type').textContent = data.type;
            document.getElementById('hud-dist').textContent = data.dist;
            document.getElementById('hud-period').textContent = data.period;
            document.getElementById('hud-rot').textContent = data.rot;
            document.getElementById('hud-moons').textContent = data.moons;
            document.getElementById('hud-fact').textContent = data.fact;

            hud.classList.add('active');

            // Zoom Camera on Focus
            sceneState.targetRotX = 35;
            sceneState.targetZoom = 600;
        }

        function resetCamera() {
            sceneState.targetRotX = 65;
            sceneState.targetRotY = 0;
            sceneState.targetZoom = 1000;
            hud.classList.remove('active');
        }

        /* Initialize Execution */
        initOrbits();
        animate();
    </script>
</body>
</html>
